<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.7400;0.8000;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><animateTransform attributeName="transform" type="translate" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.7400;0.8000;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0 12;0 12;0 12;0 0;0 0"/><rect x="110" y="556" width="530" height="60" rx="10" fill="#EFE7D8" stroke="#D2C9B8" stroke-width="1"/><text x="375" y="581" font-size="14" font-weight="500" fill="#1E1C19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">上限：上下文长度 · 一轮能准确处理多少条</text><text x="375" y="603" font-size="12" font-weight="400" fill="#8F887D" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">（实验数字见第 7 节）</text></g>
