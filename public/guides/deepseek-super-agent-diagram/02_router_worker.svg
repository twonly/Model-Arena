<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 720" width="750" height="720" style="display:block;max-width:100%;height:auto;">
  <image x="0" y="0" width="750" height="720" preserveAspectRatio="xMidYMin slice" href="paper.jpg"/>
  <rect x="0" y="0" width="750" height="720" fill="#FBF8F1" opacity="0.18"/>
  <text x="375" y="48" text-anchor="middle" font-size="20" fill="#8F887D" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif">双层架构 · Router 管交互，Worker 干具体活</text>
  <g>
    <rect x="285" y="78" width="180" height="56" rx="28" fill="#FFFEFA" stroke="#1E1C19" stroke-width="1.5"/>
    <text x="375" y="112" text-anchor="middle" font-size="18" font-weight="600" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">用户</text>
  </g>

  <g>
    <line x1="375" y1="134" x2="375" y2="178" stroke="#D2C9B8" stroke-width="2"/>
    <polygon points="375,186 368,172 382,172" fill="#CF4436">
      <animate attributeName="opacity" begin="0s" calcMode="spline" dur="6.7s" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0;0.0896;0.15;0.22;0.7;1" repeatCount="indefinite" values="0;0;0;1;1;0"/>
    </polygon>
  </g>

  <g>
    <rect x="160" y="190" width="430" height="100" rx="12" fill="#FFFEFA" stroke="#CF4436" stroke-width="2"/>
    <text x="375" y="228" text-anchor="middle" font-size="20" font-weight="700" fill="#CF4436" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">Router</text>
    <text x="375" y="256" text-anchor="middle" font-size="14" fill="#8F887D" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">交互 · 分派 · 轻量模型即可</text>
    <text x="375" y="276" text-anchor="middle" font-size="13" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">用户眼里始终是同一个 Agent</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="0s" calcMode="spline" dur="6.7s" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0;0.0896;0.3000;0.3500;1" repeatCount="indefinite" values="0;0;0;1;1"/>
    <line x1="375" y1="290" x2="170" y2="360" stroke="#D2C9B8" stroke-width="1.5"/>
    <rect x="80" y="360" width="180" height="120" rx="12" fill="#FFFEFA" stroke="#1E1C19" stroke-width="1.5"/>
    <circle cx="108" cy="388" r="8" fill="#CF4436">
      <animate attributeName="opacity" begin="0s" calcMode="spline" dur="6.7s" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0;0.0896;0.3000;0.3800;0.5000;1" repeatCount="indefinite" values="0;0;0;1;0.35;0.35"/>
    </circle>
    <text x="126" y="394" font-size="16" font-weight="600" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">Worker A</text>
    <text x="100" y="430" font-size="14" fill="#8F887D" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">最强模型</text>
    <text x="100" y="454" font-size="14" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">修字体 PR</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="0s" calcMode="spline" dur="6.7s" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0;0.0896;0.4000;0.4500;1" repeatCount="indefinite" values="0;0;0;1;1"/>
    <line x1="375" y1="290" x2="375" y2="360" stroke="#D2C9B8" stroke-width="1.5"/>
    <rect x="285" y="360" width="180" height="120" rx="12" fill="#FFFEFA" stroke="#1E1C19" stroke-width="1.5"/>
    <circle cx="313" cy="388" r="8" fill="#CF4436">
      <animate attributeName="opacity" begin="0s" calcMode="spline" dur="6.7s" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0;0.0896;0.4000;0.4800;0.6000;1" repeatCount="indefinite" values="0;0;0;1;0.35;0.35"/>
    </circle>
    <text x="331" y="394" font-size="16" font-weight="600" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">Worker B</text>
    <text x="305" y="430" font-size="14" fill="#8F887D" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">最强模型</text>
    <text x="305" y="454" font-size="14" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">查 CI 失败</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="0s" calcMode="spline" dur="6.7s" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0;0.0896;0.5000;0.5500;1" repeatCount="indefinite" values="0;0;0;1;1"/>
    <line x1="375" y1="290" x2="580" y2="360" stroke="#D2C9B8" stroke-width="1.5"/>
    <rect x="490" y="360" width="180" height="120" rx="12" fill="#FFFEFA" stroke="#1E1C19" stroke-width="1.5"/>
    <circle cx="518" cy="388" r="8" fill="#CF4436">
      <animate attributeName="opacity" begin="0s" calcMode="spline" dur="6.7s" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0;0.0896;0.5000;0.5800;0.7000;1" repeatCount="indefinite" values="0;0;0;1;0.35;0.35"/>
    </circle>
    <text x="536" y="394" font-size="16" font-weight="600" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">Worker C</text>
    <text x="510" y="430" font-size="14" fill="#8F887D" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">最强模型</text>
    <text x="510" y="454" font-size="14" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">回邮件</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="0s" calcMode="spline" dur="6.7s" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0;0.0896;0.70;0.76;1" repeatCount="indefinite" values="0;0;0;1;1"/>
    <text x="375" y="530" text-anchor="middle" font-size="14" fill="#8F887D" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">结果经 Router 汇总回用户 · Worker 彼此隔离并发</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" begin="0s" calcMode="spline" dur="6.7s" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0;0.0896;0.78;0.84;1" repeatCount="indefinite" values="0;0;0;1;1"/>
    <rect x="200" y="552" width="350" height="54" rx="8" fill="#EFE7D8" stroke="#D2C9B8" stroke-width="1"/>
    <text x="375" y="576" text-anchor="middle" font-size="14" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">Watchdog 在旁：盯基础设施，也盯有没有实质进展</text>
    <text x="375" y="596" text-anchor="middle" font-size="12" fill="#8F887D" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">独立 Control Loop，不塞进主对话</text>
  </g>

  <g>
    <rect x="48" y="648" width="654" height="44" rx="8" fill="#FFFEFA" stroke="#D2C9B8" stroke-width="1"/>
    <text x="375" y="676" text-anchor="middle" font-size="16" fill="#1E1C19" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif">轻量 Router + 最强 Worker：连续感留给人，算力留给活</text>
  </g>
</svg>
