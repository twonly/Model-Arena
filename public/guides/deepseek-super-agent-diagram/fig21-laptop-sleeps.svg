<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.7000;0.7600;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><animateTransform attributeName="transform" type="translate" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.7000;0.7600;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0 12;0 12;0 12;0 0;0 0"/><rect x="480" y="470" width="150" height="44" rx="22" fill="#FFFEFA" stroke="#B9B2A6" stroke-width="1.5"/><text x="555" y="498" font-size="15" font-weight="600" fill="#8F887D" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">环境 够不着</text></g>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.7800;0.8400;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><animateTransform attributeName="transform" type="translate" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.7800;0.8400;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0 12;0 12;0 12;0 0;0 0"/><text x="375" y="570" font-size="14" font-weight="400" fill="#1E1C19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">也碰不到其他设备上的环境</text></g>
<g><rect x="48" y="648" width="654" height="44" rx="8" fill="#FFFEFA" stroke="#D2C9B8" stroke-width="1"/><text x="375" y="676" font-size="17" font-weight="600" fill="#1E1C19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">绑在一台机上，睡了就全停</text></g>
