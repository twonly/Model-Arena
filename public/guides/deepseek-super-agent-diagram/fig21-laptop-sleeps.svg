<text x="375" y="48" font-size="20" font-weight="400" fill="#8F887D" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">设备一合盖</text>
<rect x="170" y="120" width="410" height="250" rx="10" fill="#FFFEFA" stroke="#1E1C19" stroke-width="1.8"/><rect x="140" y="370" width="470" height="16" rx="6" fill="#EFE7D8" stroke="#1E1C19" stroke-width="1.5"/><text x="375" y="410" font-size="13" font-weight="400" fill="#8F887D" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">今天的本地 Agent：三样绑在同一台设备</text>
