<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 720" width="750" height="720" style="display:block;max-width:100%;height:auto;">
<image x="0" y="0" width="750" height="720" preserveAspectRatio="xMidYMin slice" href="paper.jpg"/>
<rect x="0" y="0" width="750" height="720" fill="#FBF8F1" opacity="0.18"/>
<text x="375" y="48" font-size="20" font-weight="400" fill="#8F887D" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">从半双工到全双工</text>
<text x="60" y="100" font-size="16" font-weight="700" fill="#1E1C19" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">半双工 · 同步 run()</text>
<line x1="60" y1="180" x2="690" y2="180" stroke="#D2C9B8" stroke-width="1.5"/>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.1000;0.1600;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><rect x="60" y="150" width="110" height="30" rx="6" fill="#FFFEFA" stroke="#1E1C19" stroke-width="1.2"/><text x="115" y="170" font-size="13" font-weight="600" fill="#1E1C19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">run(测试)</text></g>
<rect x="175" y="156" height="18" rx="4" fill="#B9B2A6" width="0"><animate attributeName="width" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.1400;0.5900;1.0000" keySplines="0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;420;420"/></rect>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.1600;0.2200;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><text x="385" y="146" font-size="13" font-weight="400" fill="#8F887D" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">等工具跑完……循环卡住</text></g>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.3000;0.3600;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><animateTransform attributeName="transform" type="translate" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.3000;0.3600;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0 8;0 8;0 8;0 0;0 0"/><rect x="250" y="196" width="210" height="52" rx="10" fill="#FFFEFA" stroke="#D2C9B8" stroke-width="1.5"/><text x="264" y="220" font-size="13" font-weight="600" fill="#1E1C19" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">用户</text><text x="264" y="242" font-size="14" font-weight="400" fill="#1E1C19" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">顺便看下另一个问题？</text><text x="475" y="230" font-size="14" font-weight="700" fill="#CF4436" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">接不了</text></g>
<text x="60" y="340" font-size="16" font-weight="700" fill="#CF4436" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">全双工 · 异步 start() / stop()</text>
<line x1="60" y1="400" x2="690" y2="400" stroke="#D2C9B8" stroke-width="1.5"/>
<line x1="60" y1="480" x2="690" y2="480" stroke="#D2C9B8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="60" y="392" font-size="12" font-weight="400" fill="#8F887D" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">前台</text>
<text x="60" y="472" font-size="12" font-weight="400" fill="#8F887D" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">后台</text>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.1200;0.1800;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><rect x="100" y="370" width="110" height="30" rx="6" fill="#FFFEFA" stroke="#CF4436" stroke-width="1.4"/><text x="155" y="390" font-size="13" font-weight="600" fill="#CF4436" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">start(测试)</text></g>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.1800;0.2400;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><rect x="220" y="370" width="90" height="30" rx="6" fill="#EFE7D8" stroke="#D2C9B8" stroke-width="1"/><text x="265" y="390" font-size="13" font-weight="500" fill="#1E1C19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">Started</text></g>
<rect x="220" y="458" height="18" rx="4" fill="#1E1C19" width="0"><animate attributeName="width" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.1800;0.6300;1.0000" keySplines="0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;360;360"/></rect>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.3200;0.3800;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><rect x="330" y="370" width="150" height="30" rx="15" fill="#FFFEFA" stroke="#1E1C19" stroke-width="1.2"/><text x="405" y="390" font-size="13" font-weight="500" fill="#1E1C19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">回复用户新消息</text></g>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.4600;0.5200;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><rect x="490" y="370" width="110" height="30" rx="15" fill="#FFFEFA" stroke="#1E1C19" stroke-width="1.2"/><text x="545" y="390" font-size="13" font-weight="500" fill="#1E1C19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">继续聊</text></g>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.6400;0.7000;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><line x1="590" y1="456" x2="620" y2="404" stroke="#CF4436" stroke-width="2"/><polygon points="620.0,404.0 619.4,412.0 613.4,408.5" fill="#CF4436"/><rect x="560" y="500" width="140" height="30" rx="6" fill="#FFFEFA" stroke="#CF4436" stroke-width="1.2"/><text x="630" y="520" font-size="12" font-weight="600" fill="#CF4436" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">结果作为新事件投回</text></g>
<g opacity="0"><animate attributeName="opacity" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.7400;0.8000;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0;0;0;1;1"/><animateTransform attributeName="transform" type="translate" begin="0s" dur="6.7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0000;0.0896;0.7400;0.8000;1.0000" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1" values="0 12;0 12;0 12;0 0;0 0"/><rect x="90" y="556" width="570" height="56" rx="10" fill="#EFE7D8" stroke="#D2C9B8" stroke-width="1"/><text x="375" y="580" font-size="14" font-weight="500" fill="#1E1C19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">跑太久也能 stop()；新消息在当前一步推理结束后处理</text><text x="375" y="602" font-size="12" font-weight="400" fill="#8F887D" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">（DeepSeek Harness 已实现，暂未默认开启）</text></g>
<g><rect x="48" y="648" width="654" height="44" rx="8" fill="#FFFEFA" stroke="#D2C9B8" stroke-width="1"/><text x="375" y="676" font-size="17" font-weight="600" fill="#1E1C19" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Noto Sans CJK SC',sans-serif">后台在跑，前台还能回话</text></g>
</svg>
