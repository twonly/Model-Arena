  <!-- Hour hand: 9:41 = 9 + 41/60 = 9.6833 hours -->
  <!-- Angle from 12 o'clock: (9.6833 * 30) = 290.5 degrees -->
  <!-- In SVG coords (0 degrees = up, clockwise): 290.5 degrees -->
  <!-- dx = sin(290.5°) * 110 = -103.6, dy = -cos(290.5°) * 110 = -37.4 -->
  <line x1="400" y1="280" x2="296.4" y2="242.6" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Minute hand: 41 minutes -->
  <!-- Angle from 12 o'clock: 41 * 6 = 246 degrees -->
  <!-- dx = sin(246°) * 170 = -154.6, dy = -cos(246°) * 170 = 69.2 -->
  <line x1="400" y1="280" x2="245.4" y2="349.2" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
  
