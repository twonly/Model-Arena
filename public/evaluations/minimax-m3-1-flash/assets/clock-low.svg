    <use href="#minor-tick" transform="rotate(354 400 270)"/>
  </g>

  <g fill="#1f2933" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="400" y="116">12</text>
    <text x="482" y="132">1</text>
    <text x="542" y="198">2</text>
    <text x="564" y="270">3</text>
    <text x="542" y="342">4</text>
    <text x="482" y="408">5</text>
    <text x="400" y="424">6</text>
    <text x="318" y="408">7</text>
    <text x="258" y="342">8</text>
    <text x="236" y="270">9</text>
    <text x="258" y="198">10</text>
    <text x="318" y="132">11</text>
  </g>

  <!-- Short hour hand: 9:41, positioned 20.5 degrees past 9. -->
  <line x1="400" y1="270" x2="301.7" y2="306.8" stroke="#263238" stroke-width="11" stroke-linecap="round"/>
  <!-- Long minute hand: 41 minutes, or 246 degrees clockwise from 12. -->
  <line x1="400" y1="270" x2="260.2" y2="332.3" stroke="#e53935" stroke-width="7" stroke-linecap="round"/>
  <circle cx="400" cy="270" r="12" fill="#263238" stroke="#ffffff" stroke-width="4"/>

  <text x="400" y="545" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">09:41</text>
</svg>