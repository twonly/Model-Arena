<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Analog clock showing 9:41</title>
  <desc id="desc">A clear analog clock with all twelve hour numbers, a short hour hand correctly between 9 and 10, a long minute hand pointing to 41 minutes, and no second hand.</desc>

  <defs>
    <line id="minor-tick" x1="400" y1="76" x2="400" y2="84" stroke="#263238" stroke-width="2" stroke-linecap="round"/>
    <line id="major-tick" x1="400" y1="70" x2="400" y2="87" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
  </defs>

  <rect width="800" height="600" fill="#f5f7fa"/>

  <circle cx="400" cy="270" r="218" fill="#dfe5ea" stroke="#263238" stroke-width="5"/>
  <circle cx="400" cy="270" r="202" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>

  <g>
    <use href="#major-tick"/>
    <use href="#minor-tick" transform="rotate(6 400 270)"/>
    <use href="#minor-tick" transform="rotate(12 400 270)"/>
    <use href="#minor-tick" transform="rotate(18 400 270)"/>
    <use href="#minor-tick" transform="rotate(24 400 270)"/>
    <use href="#major-tick" transform="rotate(30 400 270)"/>
    <use href="#minor-tick" transform="rotate(36 400 270)"/>
    <use href="#minor-tick" transform="rotate(42 400 270)"/>
    <use href="#minor-tick" transform="rotate(48 400 270)"/>
    <use href="#minor-tick" transform="rotate(54 400 270)"/>
    <use href="#major-tick" transform="rotate(60 400 270)"/>
    <use href="#minor-tick" transform="rotate(66 400 270)"/>
    <use href="#minor-tick" transform="rotate(72 400 270)"/>
    <use href="#minor-tick" transform="rotate(78 400 270)"/>
    <use href="#minor-tick" transform="rotate(84 400 270)"/>
    <use href="#major-tick" transform="rotate(90 400 270)"/>
    <use href="#minor-tick" transform="rotate(96 400 270)"/>
    <use href="#minor-tick" transform="rotate(102 400 270)"/>
    <use href="#minor-tick" transform="rotate(108 400 270)"/>
    <use href="#minor-tick" transform="rotate(114 400 270)"/>
    <use href="#major-tick" transform="rotate(120 400 270)"/>
    <use href="#minor-tick" transform="rotate(126 400 270)"/>
    <use href="#minor-tick" transform="rotate(132 400 270)"/>
    <use href="#minor-tick" transform="rotate(138 400 270)"/>
    <use href="#minor-tick" transform="rotate(144 400 270)"/>
    <use href="#major-tick" transform="rotate(150 400 270)"/>
    <use href="#minor-tick" transform="rotate(156 400 270)"/>
    <use href="#minor-tick" transform="rotate(162 400 270)"/>
    <use href="#minor-tick" transform="rotate(168 400 270)"/>
    <use href="#minor-tick" transform="rotate(174 400 270)"/>
    <use href="#major-tick" transform="rotate(180 400 270)"/>
    <use href="#minor-tick" transform="rotate(186 400 270)"/>
    <use href="#minor-tick" transform="rotate(192 400 270)"/>
    <use href="#minor-tick" transform="rotate(198 400 270)"/>
    <use href="#minor-tick" transform="rotate(204 400 270)"/>
    <use href="#major-tick" transform="rotate(210 400 270)"/>
    <use href="#minor-tick" transform="rotate(216 400 270)"/>
    <use href="#minor-tick" transform="rotate(222 400 270)"/>
    <use href="#minor-tick" transform="rotate(228 400 270)"/>
    <use href="#minor-tick" transform="rotate(234 400 270)"/>
    <use href="#major-tick" transform="rotate(240 400 270)"/>
    <use href="#minor-tick" transform="rotate(246 400 270)"/>
    <use href="#minor-tick" transform="rotate(252 400 270)"/>
    <use href="#minor-tick" transform="rotate(258 400 270)"/>
    <use href="#minor-tick" transform="rotate(264 400 270)"/>
    <use href="#major-tick" transform="rotate(270 400 270)"/>
    <use href="#minor-tick" transform="rotate(276 400 270)"/>
