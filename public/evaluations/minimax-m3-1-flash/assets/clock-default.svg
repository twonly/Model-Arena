<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Analog clock showing 9:41</title>
  <desc id="description">A twelve-number analog clock with the hour hand between 9 and 10 and the minute hand indicating 41 minutes.</desc>

  <defs>
    <linearGradient id="dial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f1e9"/>
    </linearGradient>
    <g id="minor-ticks" stroke="#75808d" stroke-width="2" stroke-linecap="round">
      <line x1="400" y1="72" x2="400" y2="80" transform="rotate(6 400 280)"/>
      <line x1="400" y1="72" x2="400" y2="80" transform="rotate(12 400 280)"/>
      <line x1="400" y1="72" x2="400" y2="80" transform="rotate(18 400 280)"/>
      <line x1="400" y1="72" x2="400" y2="80" transform="rotate(24 400 280)"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#edf1f5"/>

  <!-- Clock body and dial -->
  <circle cx="400" cy="289" r="236" fill="#132238" opacity="0.14"/>
  <circle cx="400" cy="280" r="236" fill="#15263d" stroke="#0c1727" stroke-width="4"/>
  <circle cx="400" cy="280" r="226" fill="url(#dial)" stroke="#d6b46a" stroke-width="3"/>
  <circle cx="400" cy="280" r="211" fill="none" stroke="#dedbd2" stroke-width="1.5"/>

  <!-- Minute marks -->
  <g>
    <use href="#minor-ticks" transform="rotate(0 400 280)"/>
    <use href="#minor-ticks" transform="rotate(30 400 280)"/>
    <use href="#minor-ticks" transform="rotate(60 400 280)"/>
    <use href="#minor-ticks" transform="rotate(90 400 280)"/>
    <use href="#minor-ticks" transform="rotate(120 400 280)"/>
    <use href="#minor-ticks" transform="rotate(150 400 280)"/>
    <use href="#minor-ticks" transform="rotate(180 400 280)"/>
    <use href="#minor-ticks" transform="rotate(210 400 280)"/>
    <use href="#minor-ticks" transform="rotate(240 400 280)"/>
    <use href="#minor-ticks" transform="rotate(270 400 280)"/>
    <use href="#minor-ticks" transform="rotate(300 400 280)"/>
    <use href="#minor-ticks" transform="rotate(330 400 280)"/>
  </g>

  <!-- Hour marks -->
  <g stroke="#26384d" stroke-width="4" stroke-linecap="round">
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(0 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(30 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(60 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(90 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(120 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(150 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(180 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(210 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(240 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(270 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(300 400 280)"/>
    <line x1="400" y1="69" x2="400" y2="87" transform="rotate(330 400 280)"/>
  </g>

  <!-- Hands: minute at 41 minutes; hour at 9 + 41/60 hours -->
  <line x1="400" y1="280" x2="400" y2="79"
        transform="rotate(246 400 280)"
        stroke="#d94b3d" stroke-width="8" stroke-linecap="round"/>
  <line x1="400" y1="280" x2="400" y2="145"
        transform="rotate(290.5 400 280)"
        stroke="#18354f" stroke-width="12" stroke-linecap="round"/>

  <!-- All twelve numerals -->
  <g fill="#172b42" stroke="#f8f6ef" stroke-width="4" paint-order="stroke fill"
     font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700"
     text-anchor="middle" dominant-baseline="middle">
    <text x="400" y="109">12</text>
    <text x="485.5" y="131.9">1</text>
    <text x="548.1" y="194.5">2</text>
    <text x="571" y="280">3</text>
    <text x="548.1" y="365.5">4</text>
    <text x="485.5" y="428.1">5</text>
    <text x="400" y="451">6</text>
    <text x="314.5" y="428.1">7</text>
    <text x="251.9" y="365.5">8</text>
    <text x="229" y="280">9</text>
    <text x="251.9" y="194.5">10</text>
    <text x="314.5" y="131.9">11</text>
  </g>

  <!-- Central pivot -->
  <circle cx="400" cy="280" r="13" fill="#172b42" stroke="#f8f6ef" stroke-width="4"/>
  <circle cx="400" cy="280" r="5" fill="#d94b3d"/>

  <!-- Digital time label below the dial -->
  <g>
    <rect x="347" y="534" width="106" height="40" rx="20" fill="#ffffff" stroke="#c8d0da" stroke-width="2"/>
    <text x="400" y="554"
          fill="#172b42" font-family="Arial, Helvetica, sans-serif"
          font-size="24" font-weight="700" letter-spacing="1.5"
          text-anchor="middle" dominant-baseline="middle">09:41</text>
  </g>
</svg>