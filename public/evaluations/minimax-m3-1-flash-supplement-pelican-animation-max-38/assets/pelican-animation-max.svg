      <stop offset="0.55" stop-color="#f4f4eb"/>
      <stop offset="1" stop-color="#cfdee1"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1ec"/>
      <stop offset="1" stop-color="#b9cdd2"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd66a"/>
      <stop offset="1" stop-color="#eea33f"/>
