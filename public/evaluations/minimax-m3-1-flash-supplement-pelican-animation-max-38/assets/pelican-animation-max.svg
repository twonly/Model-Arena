<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="description">A cheerful pelican pedals a teal bicycle while its wheels, crank, pedals, and legs rotate in a seamless four-second loop.</desc>

  <defs>
