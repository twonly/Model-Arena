<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican riding a bicycle</title>
  <desc>A pelican pedals a bicycle with spinning wheels and a rotating crank in a seamless 4 second SMIL loop.</desc>
  <rect width="800" height="600" fill="#eaf6fb"/>
  <line x1="110" y1="520" x2="690" y2="520" stroke="#c9dfe8" stroke-width="6" stroke-linecap="round"/>

  <!-- rear wheel -->
  <circle cx="260" cy="440" r="80" fill="#f8fbff" stroke="#263238" stroke-width="12"/>
  <circle cx="260" cy="440" r="68" fill="none" stroke="#90a4ae" stroke-width="4"/>
  <g stroke="#78909c" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 260 440" to="360 260 440" dur="4s" repeatCount="indefinite"/>
    <line x1="260" y1="440" x2="330" y2="440"/>
    <line x1="260" y1="440" x2="310" y2="490"/>
    <line x1="260" y1="440" x2="260" y2="510"/>
    <line x1="260" y1="440" x2="210" y2="490"/>
    <line x1="260" y1="440" x2="190" y2="440"/>
    <line x1="260" y1="440" x2="210" y2="390"/>
    <line x1="260" y1="440" x2="260" y2="370"/>
    <line x1="260" y1="440" x2="310" y2="390"/>
    <circle cx="260" cy="372" r="6" fill="#ef6c00" stroke="none"/>
  </g>
  <circle cx="260" cy="440" r="9" fill="#37474f"/>

  <!-- front wheel -->
  <circle cx="540" cy="440" r="80" fill="#f8fbff" stroke="#263238" stroke-width="12"/>
  <circle cx="540" cy="440" r="68" fill="none" stroke="#90a4ae" stroke-width="4"/>
  <g stroke="#78909c" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 540 440" to="360 540 440" dur="4s" repeatCount="indefinite"/>
    <line x1="540" y1="440" x2="610" y2="440"/>
    <line x1="540" y1="440" x2="590" y2="490"/>
    <line x1="540" y1="440" x2="540" y2="510"/>
    <line x1="540" y1="440" x2="490" y2="490"/>
    <line x1="540" y1="440" x2="470" y2="440"/>
    <line x1="540" y1="440" x2="490" y2="390"/>
    <line x1="540" y1="440" x2="540" y2="370"/>
    <line x1="540" y1="440" x2="590" y2="390"/>
    <circle cx="540" cy="372" r="6" fill="#ef6c00" stroke="none"/>
  </g>
  <circle cx="540" cy="440" r="9" fill="#37474f"/>

  <!-- chain and frame -->
  <path d="M390 408 L260 433 M390 452 L260 447" fill="none" stroke="#607d8b" stroke-width="3"/>
  <g fill="none" stroke="#177e89" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 440 L390 430 L330 300 L260 440"/>
    <path d="M330 300 L515 300 L535 345 L390 430"/>
    <path d="M515 300 L535 345 L540 440"/>
  </g>
  <path d="M330 300 L318 286" fill="none" stroke="#455a64" stroke-width="8" stroke-linecap="round"/>
  <path d="M282 286 C304 273 348 276 358 290 C332 301 298 299 282 286 Z" fill="#37474f"/>
  <path d="M515 300 L502 266 M476 252 C496 236 526 242 531 264" fill="none" stroke="#455a64" stroke-width="9" stroke-linecap="round"/>
  <circle cx="531" cy="264" r="9" fill="#263238"/>

  <!-- pelican body, tail, neck, head, pouch and bill -->
  <path d="M286 205 C250 184 218 178 198 184 C220 200 236 214 250 226 C236 238 226 250 224 262 C252 258 278 248 296 236 Z" fill="#fbfdff" stroke="#9aa7b1" stroke-width="3"/>
  <ellipse cx="365" cy="225" rx="100" ry="60" fill="#fbfdff" stroke="#9aa7b1" stroke-width="4"/>
  <path d="M315 205 C360 175 430 195 425 245 C395 276 330 265 315 205 Z" fill="#e7eef3" stroke="#9aa7b1" stroke-width="3"/>
  <path d="M375 220 C410 205 405 165 432 140" fill="none" stroke="#9aa7b1" stroke-width="48" stroke-linecap="round"/>
  <path d="M375 220 C410 205 405 165 432 140" fill="none" stroke="#fbfdff" stroke-width="39" stroke-linecap="round"/>
  <circle cx="435" cy="143" r="34" fill="#fbfdff" stroke="#9aa7b1" stroke-width="4"/>
  <path d="M452 152 C458 201 506 224 556 204 C578 193 590 179 593 168 C551 178 502 176 466 158 Z" fill="#ffdcae" stroke="#d17f2a" stroke-width="3"/>
  <path d="M428 126 C482 124 548 145 593 168 C548 171 494 164 450 153 C438 144 430 136 428 126 Z" fill="#f6a623" stroke="#b96a00" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="446" cy="134" r="5" fill="#263238"/>
  <circle cx="448" cy="132" r="1.6" fill="#ffffff"/>

  <!-- pedaling legs attached to hips and pedals -->
  <path fill="none" stroke="#b0bec5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M332 306 L360 365 L352 430">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M332 306 L360 365 L352 430;
              M332 306 L365 349 L363 403;
              M332 306 L376 339 L390 392;
              M332 306 L388 343 L417 403;
              M332 306 L394 357 L428 430;
              M332 306 L390 373 L417 457;
              M332 306 L378 381 L390 468;
              M332 306 L365 378 L363 457;
              M332 306 L360 365 L352 430"/>
  </path>
  <path fill="none" stroke="#607d8b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" d="M350 292 L406 351 L428 430">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M350 292 L406 351 L428 430;
              M350 292 L402 367 L417 457;
              M350 292 L390 376 L390 468;
              M350 292 L376 373 L363 457;
              M350 292 L371 361 L352 430;
              M350 292 L376 345 L363 403;
              M350 292 L389 335 L390 392;
              M350 292 L401 337 L417 403;
              M350 292 L406 351 L428 430"/>
  </path>

  <!-- rotating crank and pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 430" to="360 390 430" dur="4s" repeatCount="indefinite"/>
    <circle cx="390" cy="430" r="22" fill="#eceff1" stroke="#455a64" stroke-width="6"/>
    <path d="M390 430 L428 430 M390 430 L352 430" fill="none" stroke="#37474f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="428" cy="430" r="10" fill="#263238"/>
    <circle cx="352" cy="430" r="10" fill="#263238"/>
    <circle cx="390" cy="430" r="7" fill="#90a4ae"/>
  </g>
</svg>