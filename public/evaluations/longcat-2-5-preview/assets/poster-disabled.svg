<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f9f4"/>
      <stop offset="100%" stop-color="#e8f2ea"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9e5c"/>
      <stop offset="100%" stop-color="#3d8b4f"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- 装饰圆形 -->
  <circle cx="650" cy="120" r="80" fill="#d4ead8" opacity="0.5"/>
  <circle cx="100" cy="480" r="60" fill="#d4ead8" opacity="0.4"/>
  <circle cx="720" cy="450" r="40" fill="#c8e0cc" opacity="0.5"/>
  
  <!-- 顶部装饰线 -->
  <line x1="200" y1="100" x2="600" y2="100" stroke="#4a9e5c" stroke-width="2" opacity="0.3"/>
  
  <!-- 主标题 -->
  <text x="400" y="165" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-size="56" font-weight="700" fill="#2d5a3d" text-anchor="middle" letter-spacing="4">周末骑行计划</text>
  
  <!-- 副标题 -->
  <text x="400" y="210" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-size="24" fill="#5a7a62" text-anchor="middle" letter-spacing="2">慢一点，看见城市</text>
  
  <!-- 分隔线 -->
  <line x1="280" y1="245" x2="520" y2="245" stroke="#4a9e5c" stroke-width="1.5" opacity="0.4"/>
  
  <!-- 自行车图标 -->
  <g transform="translate(400, 320)">
    <!-- 后轮 -->
    <circle cx="-55" cy="15" r="32" fill="none" stroke="#3d8b4f" stroke-width="3"/>
    <!-- 前轮 -->
    <circle cx="55" cy="15" r="32" fill="none" stroke="#3d8b4f" stroke-width="3"/>
    <!-- 车架 -->
    <path d="M -55 15 L -25 -25 L 35 -25 L 55 15" fill="none" stroke="#3d8b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -25 -25 L 0 15 L -55 15" fill="none" stroke="#3d8b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 15 L 35 -25" fill="none" stroke="#3d8b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 车座 -->
    <line x1="-25" y1="-25" x2="-30" y2="-35" stroke="#3d8b4f" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-32" cy="-38" rx="12" ry="4" fill="#3d8b4f"/>
    <!-- 车把 -->
    <line x1="35" y1="-25" x2="40" y2="-38" stroke="#3d8b4f" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="-38" x2="48" y2="-38" stroke="#3d8b4f" stroke-width="3" stroke-linecap="round"/>
    <!-- 脚踏 -->
    <circle cx="0" cy="15" r="5" fill="#3d8b4f"/>
    <line x1="0" y1="15" x2="-8" y2="28" stroke="#3d8b4f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="15" x2="8" y2="2" stroke="#3d8b4f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- 时间 -->
  <text x="400" y="400" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-size="28" font-weight="600" fill="#2d5a3d" text-anchor="middle" letter-spacing="1">10月24日 09:00</text>
  
  <!-- 地点 -->
  <text x="400" y="440" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-size="24" fill="#4a6b52" text-anchor="middle" letter-spacing="1">滨江公园东门</text>
  
  <!-- 说明 -->
  <text x="400" y="480" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-size="16" fill="#6b8a72" text-anchor="middle" letter-spacing="0.5">自备头盔 · 全程12公里</text>
  
  <!-- 按钮 -->
  <rect x="310" y="515" width="180" height="48" rx="24" fill="url(#btnGrad)"/>
  <text x="400" y="546" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">立即报名</text>
  
  <!-- 底部装饰线 -->
  <line x1="200" y1="580" x2="600" y2="580" stroke="#4a9e5c" stroke-width="2" opacity="0.3"/>
</svg>