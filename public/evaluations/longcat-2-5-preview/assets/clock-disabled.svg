<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock face -->
  <circle cx="400" cy="280" r="220" fill="#FFFFFF" stroke="#333333" stroke-width="4"/>

  <!-- Tick marks and numbers -->
  <!-- 12 -->
  <line x1="400" y1="70" x2="400" y2="85" stroke="#333" stroke-width="3"/>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">12</text>

  <!-- 1 -->
  <line x1="510" y1="93" x2="502" y2="106" stroke="#333" stroke-width="2"/>
  <text x="538" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">1</text>

  <!-- 2 -->
  <line x1="607" y1="173" x2="594" y2="181" stroke="#333" stroke-width="2"/>
  <text x="604" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">2</text>

  <!-- 3 -->
  <line x1="630" y1="280" x2="615" y2="280" stroke="#333" stroke-width="3"/>
  <text x="640" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">3</text>

  <!-- 4 -->
  <line x1="607" y1="387" x2="594" y2="379" stroke="#333" stroke-width="2"/>
  <text x="604" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">4</text>

  <!-- 5 -->
  <line x1="510" y1="467" x2="502" y2="454" stroke="#333" stroke-width="2"/>
  <text x="538" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">5</text>

  <!-- 6 -->
  <line x1="400" y1="490" x2="400" y2="475" stroke="#333" stroke-width="3"/>
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">6</text>

  <!-- 7 -->
  <line x1="290" y1="467" x2="298" y2="454" stroke="#333" stroke-width="2"/>
  <text x="262" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">7</text>

  <!-- 8 -->
  <line x1="193" y1="387" x2="206" y2="379" stroke="#333" stroke-width="2"/>
  <text x="196" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">8</text>

  <!-- 9 -->
  <line x1="170" y1="280" x2="185" y2="280" stroke="#333" stroke-width="3"/>
  <text x="160" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">9</text>

  <!-- 10 -->
  <line x1="193" y1="173" x2="206" y2="181" stroke="#333" stroke-width="2"/>
  <text x="196" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">10</text>

  <!-- 11 -->
  <line x1="290" y1="93" x2="298" y2="106" stroke="#333" stroke-width="2"/>
  <text x="262" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#333">11</text>

  <!-- Hour hand: at 9:41, hour position = 9 + 41/60 = 9.6833 hours -->
  <!-- Angle from 12 o'clock = 9.6833 * 30 = 290.5 degrees -->
  <!-- In SVG coords: dx = sin(angle) * length, dy = -cos(angle) * length -->
  <!-- sin(290.5) = -0.9408, cos(290.5) = 0.3390 -->
  <!-- dx = -0.9408 * 100 = -94.08, dy = -0.3390 * 100 = -33.90 -->
  <line x1="400" y1="280" x2="305.92" y2="246.10" stroke="#333" stroke-width="8" stroke-linecap="round"/>

  <!-- Minute hand: at minute 41, angle = 41 * 6 = 246 degrees -->
  <!-- sin(246) = -0.9135, cos(246) = -0.4067 -->
  <!-- dx = -0.9135 * 160 = -146.16, dy = 0.4067 * 160 = 65.07 -->
  <line x1="400" y1="280" x2="253.84" y2="345.07" stroke="#333" stroke-width="5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="400" cy="280" r="6" fill="#333"/>

  <!-- Label below dial -->
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#333">09:41</text>
</svg>