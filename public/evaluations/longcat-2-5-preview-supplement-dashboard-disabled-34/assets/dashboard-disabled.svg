<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00000020"/>
    </filter>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA0E9"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E6DA4"/>
      <stop offset="100%" stop-color="#1F5A8A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#F0F2F5" rx="0"/>

  <!-- Card -->
  <rect x="60" y="40" width="680" height="520" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- Title -->
  <text x="100" y="100" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1A1A2E">Quarterly Revenue</text>

  <!-- Subtitle -->
  <text x="100" y="128" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#8888A0">Fiscal Year 2024</text>

  <!-- Chart area -->
  <!-- Chart background -->
  <rect x="160" y="160" width="520" height="300" rx="8" fill="#F8F9FC"/>

  <!-- Grid lines and Y-axis labels -->
  <!-- 0 -->
  <line x1="160" y1="460" x2="680" y2="460" stroke="#E0E4EC" stroke-width="1"/>
  <text x="145" y="465" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8888A0" text-anchor="end">0</text>

  <!-- 10 -->
  <line x1="160" y1="360" x2="680" y2="360" stroke="#E0E4EC" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="145" y="365" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8888A0" text-anchor="end">10</text>

  <!-- 20 -->
  <line x1="160" y1="260" x2="680" y2="260" stroke="#E0E4EC" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="145" y="265" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8888A0" text-anchor="end">20</text>

  <!-- 30 -->
  <line x1="160" y1="160" x2="680" y2="160" stroke="#E0E4EC" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="145" y="165" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#8888A0" text-anchor="end">30</text>

  <!-- Y-axis line -->
  <line x1="160" y1="160" x2="160" y2="460" stroke="#D0D5E0" stroke-width="1.5"/>

  <!-- X-axis line -->
  <line x1="160" y1="460" x2="680" y2="460" stroke="#D0D5E0" stroke-width="1.5"/>

  <!-- Bars -->
  <!-- Scale: 30 units = 300px, so 1 unit = 10px -->
  <!-- Q1 = 12 -> 120px height, y = 460-120 = 340 -->
  <!-- Q2 = 24 -> 240px height, y = 460-240 = 220 -->
  <!-- Q3 = 18 -> 180px height, y = 460-180 = 280 -->
  <!-- Q4 = 30 -> 300px height, y = 460-300 = 160 -->

  <!-- Bar width = 70, spacing = 50 -->
  <!-- Q1: x = 200 -->
  <rect x="200" y="340" width="70" height="120" rx="6" fill="url(#barGrad1)"/>
  <!-- Q2: x = 320 -->
  <rect x="320" y="220" width="70" height="240" rx="6" fill="url(#barGrad2)"/>
  <!-- Q3: x = 440 -->
  <rect x="440" y="280" width="70" height="180" rx="6" fill="url(#barGrad3)"/>
  <!-- Q4: x = 560 -->
  <rect x="560" y="160" width="70" height="300" rx="6" fill="url(#barGrad4)"/>

  <!-- Value labels above bars -->
  <text x="235" y="330" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#357ABD" text-anchor="middle">12</text>
  <text x="355" y="210" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4A90D9" text-anchor="middle">24</text>
  <text x="475" y="270" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#357ABD" text-anchor="middle">18</text>
  <text x="595" y="150" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1F5A8A" text-anchor="middle">30</text>

  <!-- X-axis labels -->
  <text x="235" y="485" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#555570" text-anchor="middle">Q1</text>
  <text x="355" y="485" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#555570" text-anchor="middle">Q2</text>
  <text x="475" y="485" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#555570" text-anchor="middle">Q3</text>
  <text x="595" y="485" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#555570" text-anchor="middle">Q4</text>

  <!-- Summary section -->
  <!-- Divider -->
  <line x1="100" y1="510" x2="700" y2="510" stroke="#E8ECF2" stroke-width="1"/>

  <!-- Total label -->
  <rect x="100" y="525" width="200" height="40" rx="8" fill="#F0F4FA"/>
  <text x="120" y="550" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#555570">Total:</text>
  <text x="180" y="550" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1A1A2E">84</text>

  <!-- Best label -->
  <rect x="320" y="525" width="200" height="40" rx="8" fill="#F0F4FA"/>
  <text x="340" y="550" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#555570">Best:</text>
  <text x="395" y="550" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1F5A8A">Q4</text>

  <!-- Decorative accent line at top of card -->
  <rect x="60" y="40" width="680" height="6" rx="3" fill="#4A90D9"/>
</svg>