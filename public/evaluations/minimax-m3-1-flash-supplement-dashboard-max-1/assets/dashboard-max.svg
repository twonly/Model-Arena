<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Quarterly Revenue</title>
  <desc id="chart-description">A dashboard card with a vertical bar chart showing Q1 at 12, Q2 at 24, Q3 at 18, and Q4 at 30. Total revenue is 84 and the best quarter is Q4.</desc>

  <defs>
    <linearGradient id="page-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EEF3F9"/>
    </linearGradient>
    <linearGradient id="bar-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#page-background)"/>

  <g filter="url(#card-shadow)">
    <rect x="32" y="32" width="736" height="536" rx="26" fill="#FFFFFF"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="88" fill="#172033" font-size="28" font-weight="700" letter-spacing="-0.5">Quarterly Revenue</text>
    <text x="72" y="115" fill="#64748B" font-size="14">Quarterly performance overview</text>

    <g>
      <rect x="475" y="62" width="130" height="58" rx="14" fill="#EEF2FF"/>
      <circle cx="493" cy="91" r="5" fill="#6366F1"/>
      <text x="510" y="97" fill="#3730A3" font-size="16" font-weight="700">Total: 84</text>
    </g>

    <g>
      <rect x="625" y="62" width="103" height="58" rx="14" fill="#ECFDF5"/>
      <circle cx="643" cy="91" r="5" fill="#10B981"/>
      <text x="660" y="97" fill="#047857" font-size="16" font-weight="700">Best: Q4</text>
    </g>

    <line x1="72" y1="140" x2="728" y2="140" stroke="#EDF1F6"/>

    <g fill="none" stroke="#E2E8F0" stroke-width="1">
      <line x1="145" y1="180" x2="710" y2="180"/>
      <line x1="145" y1="280" x2="710" y2="280"/>
      <line x1="145" y1="380" x2="710" y2="380"/>
    </g>

    <line x1="145" y1="160" x2="145" y2="480" stroke="#CBD5E1" stroke-width="1.5"/>

    <g fill="#64748B" font-size="12" text-anchor="end" dominant-baseline="middle">
      <text x="126" y="180">30</text>
      <text x="126" y="280">20</text>
      <text x="126" y="380">10</text>
      <text x="126" y="480">0</text>
    </g>

    <g fill="url(#bar-fill)">
      <path d="M178 370 Q178 360 188 360 H254 Q264 360 264 370 V480 H178 Z"/>
      <path d="M319 250 Q319 240 329 240 H395 Q405 240 405 250 V480 H319 Z"/>
      <path d="M460 310 Q460 300 470 300 H536 Q546 300 546 310 V480 H460 Z"/>
      <path d="M601 190 Q601 180 611 180 H677 Q687 180 687 190 V480 H601 Z"/>
    </g>

    <g fill="#FFFFFF" opacity="0.12">
      <path d="M186 370 Q186 368 190 368 H254 Q256 368 256 370 V480 H186 Z"/>
      <path d="M327 250 Q327 248 331 248 H395 Q397 248 397 250 V480 H327 Z"/>
      <path d="M468 310 Q468 308 472 308 H536 Q538 308 538 310 V480 H468 Z"/>
      <path d="M609 190 Q609 188 613 188 H677 Q679 188 679 190 V480 H609 Z"/>
    </g>

    <line x1="145" y1="480" x2="710" y2="480" stroke="#94A3B8" stroke-width="2"/>

    <g fill="#334155" font-size="15" font-weight="700" text-anchor="middle">
      <text x="221" y="344">12</text>
      <text x="362" y="224">24</text>
      <text x="503" y="284">18</text>
      <text x="644" y="164">30</text>
    </g>

    <g fill="#475569" font-size="14" font-weight="600" text-anchor="middle">
      <text x="221" y="514">Q1</text>
      <text x="362" y="514">Q2</text>
      <text x="503" y="514">Q3</text>
      <text x="644" y="514">Q4</text>
    </g>
  </g>
</svg>