<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="clock-title clock-description">
  <title id="clock-title">Analog clock showing 9:41</title>
  <desc id="clock-description">A clock face displaying exactly nine forty-one. The short hour hand is between 9 and 10, and the long minute hand points to minute 41. There is no second hand.</desc>

  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52677f"/>
      <stop offset="0.48" stop-color="#263b52"/>
      <stop offset="1" stop-color="#14263a"/>
    </linearGradient>

    <radialGradient id="face" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#fafbfd"/>
      <stop offset="1" stop-color="#edf1f5"/>
    </radialGradient>

    <filter id="clock-shadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#14263b" flood-opacity="0.24"/>
    </filter>

    <filter id="hand-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#17283b" flood-opacity="0.24"/>
    </filter>

    <line id="minor-tick" x1="400" y1="78" x2="400" y2="84" stroke="#718096" stroke-width="1.6" stroke-linecap="round"/>
    <line id="major-tick" x1="400" y1="78" x2="400" y2="91" stroke="#263b52" stroke-width="3.2" stroke-linecap="round"/>

    <g id="tick-sector">
      <use xlink:href="#minor-tick" transform="rotate(6 400 275)"/>
      <use xlink:href="#minor-tick" transform="rotate(12 400 275)"/>
      <use xlink:href="#minor-tick" transform="rotate(18 400 275)"/>
      <use xlink:href="#minor-tick" transform="rotate(24 400 275)"/>
      <use xlink:href="#major-tick" transform="rotate(30 400 275)"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#eef3f8"/>

  <circle cx="400" cy="275" r="220" fill="#cbd5df" filter="url(#clock-shadow)"/>
  <circle cx="400" cy="275" r="216" fill="url(#bezel)"/>
  <circle cx="400" cy="275" r="205" fill="url(#face)" stroke="#ffffff" stroke-width="2"/>

  <g aria-hidden="true">
    <use xlink:href="#tick-sector" transform="rotate(0 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(30 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(60 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(90 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(120 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(150 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(180 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(210 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(240 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(270 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(300 400 275)"/>
    <use xlink:href="#tick-sector" transform="rotate(330 400 275)"/>
  </g>

  <g fill="#203044" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="400" y="108">12</text>
    <text x="484" y="130">1</text>
    <text x="545" y="192">2</text>
    <text x="567" y="275">3</text>
    <text x="545" y="358">4</text>
    <text x="484" y="420">5</text>
    <text x="400" y="442">6</text>
    <text x="316" y="420">7</text>
    <text x="255" y="358">8</text>
    <text x="233" y="275">9</text>
    <text x="255" y="192">10</text>
    <text x="316" y="130">11</text>
  </g>

  <g filter="url(#hand-shadow)">
    <path d="M 400 169 L 407 185 L 405 267 L 395 267 L 393 185 Z" fill="#17324d" transform="rotate(290.5 400 275)"/>
    <path d="M 400 121 L 408 137 L 405 267 L 395 267 L 392 137 Z" fill="#d94841" transform="rotate(246 400 275)"/>
  </g>

  <circle cx="400" cy="275" r="13" fill="#ffffff" stroke="#263b52" stroke-width="2"/>
  <circle cx="400" cy="275" r="5.5" fill="#d94841"/>

  <rect x="338" y="516" width="124" height="44" rx="22" fill="#ffffff" stroke="#cad5df" stroke-width="2"/>
  <text x="400" y="539" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2" text-anchor="middle" dominant-baseline="middle">09:41</text>
</svg>