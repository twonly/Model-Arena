<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="clockTitle">
  <title id="clockTitle">Analog clock showing exactly 9:41</title>
  <rect width="800" height="600" fill="#f3f4f6"/>

  <circle cx="400" cy="270" r="215" fill="#fffdf8" stroke="#1f2937" stroke-width="6"/>
  <circle cx="400" cy="270" r="204" fill="none" stroke="#d1d5db" stroke-width="2"/>

  <g stroke="#374151" stroke-width="4" stroke-linecap="round">
    <line x1="400" y1="66" x2="400" y2="84"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(30 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(60 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(90 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(120 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(150 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(180 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(210 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(240 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(270 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(300 400 270)"/>
    <line x1="400" y1="66" x2="400" y2="84" transform="rotate(330 400 270)"/>
  </g>

  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle" dominant-baseline="middle">
    <text x="400" y="100">12</text>
    <text x="485" y="123">1</text>
    <text x="547" y="185">2</text>
    <text x="570" y="270">3</text>
    <text x="547" y="355">4</text>
    <text x="485" y="417">5</text>
    <text x="400" y="440">6</text>
    <text x="315" y="417">7</text>
    <text x="253" y="355">8</text>
    <text x="230" y="270">9</text>
    <text x="253" y="185">10</text>
    <text x="315" y="123">11</text>
  </g>

  <!-- Hour hand: 290.5 degrees, correctly between 9 and 10 at 9:41. -->
  <line x1="400" y1="270" x2="400" y2="152"
        stroke="#111827" stroke-width="12" stroke-linecap="round"
        transform="rotate(290.5 400 270)"/>

  <!-- Minute hand: 246 degrees, indicating minute 41. -->
  <line x1="400" y1="270" x2="400" y2="100"
        stroke="#374151" stroke-width="7" stroke-linecap="round"
        transform="rotate(246 400 270)"/>

  <circle cx="400" cy="270" r="11" fill="#111827"/>
  <circle cx="400" cy="270" r="4" fill="#fffdf8"/>

  <text x="400" y="535" fill="#374151"
        font-family="Arial, Helvetica, sans-serif" font-size="24"
        font-weight="500" letter-spacing="2" text-anchor="middle">09:41</text>
</svg>