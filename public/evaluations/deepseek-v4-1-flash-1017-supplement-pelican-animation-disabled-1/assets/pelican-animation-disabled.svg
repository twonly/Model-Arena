<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#c8dce8"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d4a0"/>
      <stop offset="100%" stop-color="#8fb87a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect y="480" width="800" height="120" fill="url(#ground)"/>
  <ellipse cx="400" cy="480" rx="420" ry="15" fill="#a0c888" opacity="0.5"/>

  <!-- Sun -->
  <circle cx="680" cy="80" r="45" fill="#fff4c0" opacity="0.8"/>
  <circle cx="680" cy="80" r="35" fill="#ffe870"/>

  <!-- Clouds -->
  <g opacity="0.6">
    <ellipse cx="150" cy="100" rx="60" ry="25" fill="white"/>
    <ellipse cx="190" cy="90" rx="45" ry="20" fill="white"/>
    <ellipse cx="120" cy="95" rx="40" ry="18" fill="white"/>
  </g>
  <g opacity="0.4">
    <ellipse cx="550" cy="140" rx="50" ry="20" fill="white"/>
    <ellipse cx="590" cy="130" rx="40" ry="18" fill="white"/>
  </g>

  <!-- BICYCLE GROUP -->
  <g>
    <!-- Rear wheel -->
    <g>
      <circle cx="280" cy="440" r="60" fill="none" stroke="#333" stroke-width="5"/>
      <circle cx="280" cy="440" r="55" fill="none" stroke="#555" stroke-width="1.5"/>
      <circle cx="280" cy="440" r="8" fill="#666"/>
      <!-- Spokes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 280 440" to="360 280 440" dur="4s" repeatCount="indefinite"/>
        <line x1="280" y1="385" x2="280" y2="495" stroke="#888" stroke-width="1.5"/>
        <line x1="225" y1="440" x2="335" y2="440" stroke="#888" stroke-width="1.5"/>
        <line x1="241" y1="401" x2="319" y2="479" stroke="#888" stroke-width="1.5"/>
        <line x1="319" y1="401" x2="241" y2="479" stroke="#888" stroke-width="1.5"/>
        <line x1="260" y1="388" x2="300" y2="492" stroke="#888" stroke-width="1"/>
        <line x1="300" y1="388" x2="260" y2="492" stroke="#888" stroke-width="1"/>
        <line x1="228" y1="420" x2="332" y2="460" stroke="#888" stroke-width="1"/>
        <line x1="228" y1="460" x2="332" y2="420" stroke="#888" stroke-width="1"/>
      </g>
    </g>

    <!-- Front wheel -->
    <g>
      <circle cx="520" cy="440" r="60" fill="none" stroke="#333" stroke-width="5"/>
      <circle cx="520" cy="440" r="55" fill="none" stroke="#555" stroke-width="1.5"/>
      <circle cx="520" cy="440" r="8" fill="#666"/>
      <!-- Spokes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 520 440" to="360 520 440" dur="4s" repeatCount="indefinite"/>
        <line x1="520" y1="385" x2="520" y2="495" stroke="#888" stroke-width="1.5"/>
        <line x1="465" y1="440" x2="575" y2="440" stroke="#888" stroke-width="1.5"/>
        <line x1="481" y1="401" x2="559" y2="479" stroke="#888" stroke-width="1.5"/>
        <line x1="559" y1="401" x2="481" y2="479" stroke="#888" stroke-width="1.5"/>
        <line x1="500" y1="388" x2="540" y2="492" stroke="#888" stroke-width="1"/>
        <line x1="540" y1="388" x2="500" y2="492" stroke="#888" stroke-width="1"/>
        <line x1="468" y1="420" x2="572" y2="460" stroke="#888" stroke-width="1"/>
        <line x1="468" y1="460" x2="572" y2="420" stroke="#888" stroke-width="1"/>
      </g>
    </g>

    <!-- Frame -->
    <g stroke="#cc3333" stroke-width="5" fill="none" stroke-linecap="round">
      <!-- Seat tube -->
      <line x1="370" y1="340" x2="340" y2="440"/>
      <!-- Top tube -->
      <line x1="370" y1="340" x2="490" y2="340"/>
      <!-- Down tube -->
      <line x1="340" y1="440" x2="490" y2="340"/>
      <!-- Chain stay -->
      <line x1="340" y1="440" x2="280" y2="440"/>
      <!-- Seat stay -->
      <line x1="370" y1="340" x2="280" y2="440"/>
      <!-- Head tube -->
      <line x1="490" y1="340" x2="520" y2="440"/>
      <!-- Fork -->
      <line x1="490" y1="340" x2="520" y2="440"/>
    </g>

    <!-- Handlebar -->
    <g stroke="#444" stroke-width="4" fill="none" stroke-linecap="round">
      <line x1="490" y1="340" x2="510" y2="310"/>
      <line x1="510" y1="310" x2="530" y2="305"/>
      <line x1="510" y1="310" x2="495" y2="300"/>
    </g>

    <!-- Saddle -->
    <ellipse cx="370" cy="335" rx="22" ry="7" fill="#553322"/>
    <line x1="370" y1="335" x2="370" y2="340" stroke="#444" stroke-width="3"/>

    <!-- Crank and pedals -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 340 440" to="360 340 440" dur="4s" repeatCount="indefinite"/>
      <!-- Crank arms -->
      <line x1="340" y1="440" x2="340" y2="475" stroke="#555" stroke-width="4" stroke-linecap="round"/>
      <line x1="340" y1="440" x2="340" y2="405" stroke="#555" stroke-width="4" stroke-linecap="round"/>
      <!-- Pedals -->
      <rect x="328" y="472" width="24" height="6" rx="2" fill="#333"/>
      <rect x="328" y="402" width="24" height="6" rx="2" fill="#333"/>
      <!-- Chainring -->
      <circle cx="340" cy="440" r="18" fill="none" stroke="#666" stroke-width="3"/>
      <circle cx="340" cy="440" r="6" fill="#777"/>
    </g>

    <!-- Chain -->
    <path d="M340 422 L280 440 M340 458 L280 440" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="0" to="14" dur="0.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- PELICAN -->
  <g>
    <!-- Body -->
    <ellipse cx="400" cy="290" rx="55" ry="40" fill="#f0ead6" stroke="#d4c8a8" stroke-width="1.5"/>
    <!-- Belly -->
    <ellipse cx="410" cy="305" rx="35" ry="25" fill="#faf5e8"/>

    <!-- Tail feathers -->
    <path d="M350 280 Q330 260 320 275 Q335 285 350 290" fill="#e8dcc0" stroke="#d4c8a8" stroke-width="1"/>
    <path d="M348 290 Q325 280 318 295 Q335 298 348 298" fill="#e0d4b8" stroke="#d4c8a8" stroke-width="1"/>

    <!-- Neck -->
    <path d="M430 270 Q450 240 455 210 Q458 195 450 185" fill="none" stroke="#f0ead6" stroke-width="18" stroke-linecap="round"/>
    <path d="M430 270 Q450 240 455 210 Q458 195 450 185" fill="none" stroke="#faf5e8" stroke-width="12" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="448" cy="178" rx="22" ry="20" fill="#f0ead6" stroke="#d4c8a8" stroke-width="1.5"/>
    <ellipse cx="450" cy="175" rx="18" ry="16" fill="#faf5e8"/>

    <!-- Eye -->
    <circle cx="458" cy="172" r="4" fill="#222"/>
    <circle cx="459" cy="171" r="1.5" fill="white"/>

    <!-- Bill - upper -->
    <path d="M465 178 Q510 170 540 185 Q520 188 465 185 Z" fill="#e8a020" stroke="#cc8800" stroke-width="1.5"/>
    <!-- Bill - lower with pouch -->
    <path d="M465 185 Q510 188 540 185 Q530 210 500 215 Q475 215 465 195 Z" fill="#f0b830" stroke="#cc8800" stroke-width="1.5"/>
    <!-- Pouch detail -->
    <path d="M470 190 Q500 200 525 192" fill="none" stroke="#d4a020" stroke-width="1" opacity="0.6"/>

    <!-- Wing (near side) -->
    <path d="M380 275 Q360 260 355 280 Q350 300 370 310 Q390 315 400 300 Q395 285 380 275 Z" fill="#e0d4b8" stroke="#c8b898" stroke-width="1.5"/>
    <!-- Wing feather lines -->
    <path d="M365 285 Q375 290 385 288" fill="none" stroke="#c8b898" stroke-width="1"/>
    <path d="M362 295 Q375 300 388 296" fill="none" stroke="#c8b898" stroke-width="1"/>

    <!-- Far wing -->
    <path d="M420 270 Q440 255 445 275 Q448 295 430 305 Q415 300 420 270 Z" fill="#e8dcc0" stroke="#d4c8a8" stroke-width="1"/>

    <!-- Legs - animated pedaling -->
    <!-- Near leg (right side) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 340 440" to="360 340 440" dur="4s" repeatCount="indefinite"/>
      <!-- Upper leg -->
      <line x1="340" y1="440" x2="390" y2="380" stroke="#e8a020" stroke-width="7" stroke-linecap="round"/>
      <!-- Lower leg -->
      <line x1="390" y1="380" x2="340" y2="475" stroke="#e8a020" stroke-width="6" stroke-linecap="round"/>
      <!-- Foot -->
      <ellipse cx="340" cy="475" rx="10" ry="5" fill="#e8a020"/>
    </g>

    <!-- Far leg (left side) - offset by 180 degrees -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 340 440" to="540 340 440" dur="4s" repeatCount="indefinite"/>
      <line x1="340" y1="440" x2="390" y2="380" stroke="#d49018" stroke-width="6" stroke-linecap="round"/>
      <line x1="390" y1="380" x2="340" y2="405" stroke="#d49018" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="340" cy="405" rx="9" ry="4" fill="#d49018"/>
    </g>

    <!-- Body bob animation -->
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0;0,-3;0,0" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- Ground details -->
  <g opacity="0.3">
    <ellipse cx="200" cy="490" rx="30" ry="5" fill="#6a9a50"/>
    <ellipse cx="600" cy="495" rx="25" ry="4" fill="#6a9a50"/>
    <ellipse cx="400" cy="500" rx="20" ry="3" fill="#6a9a50"/>
  </g>

  <!-- Small grass tufts -->
  <g stroke="#6a9a50" stroke-width="2" fill="none" opacity="0.5">
    <path d="M100 485 Q105 470 108 485"/>
    <path d="M105 485 Q110 465 115 485"/>
    <path d="M650 490 Q655 475 658 490"/>
    <path d="M655 490 Q660 470 665 490"/>
    <path d="M350 495 Q355 480 358 495"/>
  </g>
</svg>