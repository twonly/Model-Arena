<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Background -->
  <rect width="500" height="400" fill="#e8f4f8"/>
  
  <!-- Ground -->
  <rect x="0" y="350" width="500" height="50" fill="#8B7355"/>
  <line x1="0" y1="350" x2="500" y2="350" stroke="#6B5335" stroke-width="2"/>
  
  <!-- Bicycle - Back Wheel -->
  <circle cx="160" cy="310" r="45" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="160" cy="310" r="5" fill="#333"/>
  <!-- Spokes -->
  <line x1="160" y1="265" x2="160" y2="355" stroke="#666" stroke-width="1.5"/>
  <line x1="115" y1="310" x2="205" y2="310" stroke="#666" stroke-width="1.5"/>
  <line x1="128" y1="278" x2="192" y2="342" stroke="#666" stroke-width="1.5"/>
  <line x1="192" y1="278" x2="128" y2="342" stroke="#666" stroke-width="1.5"/>
  
  <!-- Bicycle - Front Wheel -->
  <circle cx="340" cy="310" r="45" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="340" cy="310" r="5" fill="#333"/>
  <!-- Spokes -->
  <line x1="340" y1="265" x2="340" y2="355" stroke="#666" stroke-width="1.5"/>
  <line x1="295" y1="310" x2="385" y2="310" stroke="#666" stroke-width="1.5"/>
  <line x1="308" y1="278" x2="372" y2="342" stroke="#666" stroke-width="1.5"/>
  <line x1="372" y1="278" x2="308" y2="342" stroke="#666" stroke-width="1.5"/>
  
  <!-- Bicycle Frame -->
  <!-- Seat tube -->
  <line x1="200" y1="260" x2="160" y2="310" stroke="#E63946" stroke-width="5"/>
  <!-- Top tube -->
  <line x1="200" y1="260" x2="310" y2="260" stroke="#E63946" stroke-width="5"/>
  <!-- Down tube -->
  <line x1="200" y1="260" x2="250" y2="310" stroke="#E63946" stroke-width="5"/>
  <!-- Chain stay -->
  <line x1="160" y1="310" x2="250" y2="310" stroke="#E63946" stroke-width="5"/>
  <!-- Seat stay -->
  <line x1="160" y1="310" x2="310" y2="260" stroke="#E63946" stroke-width="4"/>
  <!-- Head tube / fork -->
  <line x1="310" y1="260" x2="340" y2="310" stroke="#E63946" stroke-width="5"/>
  
  <!-- Handlebar post -->
  <line x1="310" y1="260" x2="320" y2="235" stroke="#333" stroke-width="4"/>
  <!-- Handlebars -->
  <line x1="300" y1="235" x2="340" y2="235" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Seat -->
  <ellipse cx="200" cy="255" rx="18" ry="6" fill="#333"/>
  
  <!-- Pedal crank -->
  <circle cx="250" cy="310" r="8" fill="#333"/>
  <line x1="250" y1="310" x2="235" y2="295" stroke="#333" stroke-width="3"/>
  <line x1="250" y1="310" x2="265" y2="325" stroke="#333" stroke-width="3"/>
  <!-- Pedals -->
  <rect x="228" y="290" width="14" height="5" rx="2" fill="#555" transform="rotate(-20,235,292)"/>
  <rect x="258" y="322" width="14" height="5" rx="2" fill="#555" transform="rotate(-20,265,324)"/>
  
  <!-- Chain -->
  <ellipse cx="205" cy="310" rx="45" ry="12" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Pelican Body -->
  <ellipse cx="230" cy="210" rx="55" ry="40" fill="white" stroke="#ccc" stroke-width="1.5"/>
  
  <!-- Pelican Wing (back) -->
  <path d="M200 195 Q170 180 160 210 Q170 220 200 215" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  
  <!-- Pelican Wing (front) -->
  <path d="M240 195 Q270 175 285 200 Q275 215 245 215" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  
  <!-- Pelican Neck -->
  <path d="M260 190 Q280 160 275 130 Q270 110 260 100" fill="white" stroke="#ccc" stroke-width="1.5"/>
  <path d="M245 185 Q265 155 260 125 Q255 105 245 95" fill="white" stroke="#ccc" stroke-width="1.5"/>
  <path d="M245 95 Q260 100 260 100" fill="white" stroke="#ccc" stroke-width="1.5"/>
  
  <!-- Pelican Head -->
  <ellipse cx="255" cy="90" rx="22" ry="20" fill="white" stroke="#ccc" stroke-width="1.5"/>
  
  <!-- Pelican Eye -->
  <circle cx="262" cy="85" r="4" fill="#333"/>
  <circle cx="263" cy="84" r="1.5" fill="white"/>
  
  <!-- Pelican Beak -->
  <path d="M275 88 L320 95 L315 105 L275 100 Z" fill="#F4A460" stroke="#D2691E" stroke-width="1"/>
  <!-- Beak pouch -->
  <path d="M275 100 Q295 115 315 105" fill="#F4A460" stroke="#D2691E" stroke-width="1"/>
  
  <!-- Pelican Legs -->
  <!-- Left leg -->
  <line x1="215" y1="245" x2="210" y2="290" stroke="#F4A460" stroke-width="4"/>
  <line x1="210" y1="290" x2="200" y2="295" stroke="#F4A460" stroke-width="3"/>
  <!-- Right leg -->
  <line x1="240" y1="245" x2="250" y2="290" stroke="#F4A460" stroke-width="4"/>
  <line x1="250" y1="290" x2="260" y2="295" stroke="#F4A460" stroke-width="3"/>
  
  <!-- Pelican feet on pedals -->
  <path d="M195 293 L200 295 L205 293" fill="none" stroke="#F4A460" stroke-width="2"/>
  <path d="M255 293 L260 295 L265 293" fill="none" stroke="#F4A460" stroke-width="2"/>
  
  <!-- Pelican Tail -->
  <path d="M175 210 Q155 200 150 215 Q155 220 175 215" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  
  <!-- Motion lines -->
  <line x1="80" y1="280" x2="50" y2="280" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="300" x2="45" y2="300" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="320" x2="55" y2="320" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small clouds -->
  <ellipse cx="80" cy="60" rx="30" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="100" cy="55" rx="25" ry="12" fill="white" opacity="0.8"/>
  <ellipse cx="400" cy="80" rx="35" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="420" cy="75" rx="25" ry="12" fill="white" opacity="0.8"/>
</svg>