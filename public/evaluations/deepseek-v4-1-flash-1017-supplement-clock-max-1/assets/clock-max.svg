<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" rx="10" ry="10" />

  <!-- Clock Face -->
  <circle cx="400" cy="280" r="240" fill="#ffffff" filter="url(#drop-shadow)" stroke="#212529" stroke-width="10" />
  <circle cx="400" cy="280" r="220" fill="none" stroke="#dee2e6" stroke-width="2" />

  <!-- Minute Ticks -->
  <circle cx="400" cy="280" r="210" fill="none" stroke="#adb5bd" stroke-width="3" stroke-dasharray="2 19.99115" transform="rotate(-90, 400, 280)" />

  <!-- Hour Ticks (5-minute marks) -->
  <circle cx="400" cy="280" r="210" fill="none" stroke="#212529" stroke-width="6" stroke-dasharray="4 105.9557" transform="rotate(-90, 400, 280)" />

  <!-- Numbers 1-12 -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#212529" text-anchor="middle" dominant-baseline="central">
    <text x="482.5" y="137.1">1</text>
    <text x="542.9" y="197.5">2</text>
    <text x="565" y="280">3</text>
    <text x="542.9" y="362.5">4</text>
    <text x="482.5" y="422.9">5</text>
    <text x="400" y="445">6</text>
    <text x="317.5" y="422.9">7</text>
    <text x="257.1" y="362.5">8</text>
    <text x="235" y="280">9</text>
    <text x="257.1" y="197.5">10</text>
    <text x="317.5" y="137.1">11</text>
    <text x="400" y="115">12</text>
  </g>

  <!-- Minute Hand (Longer, thinner) -->
  <line x1="400" y1="305" x2="400" y2="120" stroke="#212529" stroke-width="8" stroke-linecap="round" transform="rotate(246, 400, 280)" />

  <!-- Hour Hand (Shorter, thicker) -->
  <line x1="400" y1="295" x2="400" y2="180" stroke="#212529" stroke-width="12" stroke-linecap="round" transform="rotate(290.5, 400, 280)" />

  <!-- Center Cap -->
  <circle cx="400" cy="280" r="14" fill="#212529" />
  <circle cx="400" cy="280" r="6" fill="#ffffff" />

  <!-- Label "09:41" -->
  <text x="400" y="565" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="bold" fill="#343a40" text-anchor="middle">09:41</text>
</svg>