name: Standard model benchmarks
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [health, standard]
        default: health
        description: Resume health checks or the current weekly report
permissions:
  contents: read
concurrency:
  group: tokrace-benchmarks
  cancel-in-progress: false
jobs:
  benchmark:
    if: vars.BENCHMARK_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node automation/benchmarks.mjs
        env:
          TOKRACE_URL: https://www.tokrace.com
          BENCHMARK_SECRET: ${{ secrets.BENCHMARK_SECRET }}
          BENCHMARK_MODE: ${{ inputs.mode }}
